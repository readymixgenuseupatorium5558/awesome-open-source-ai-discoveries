name: Suggest a project
description: Add a useful project with primary sources and practical context.
title: "Add: "
body:
  - type: input
    id: project
    attributes:
      label: Project name and canonical repository URL
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: What can someone do with it?
      description: Explain the result and why this collection is a fit.
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Primary sources, requirements and limitations
      description: Link upstream documentation. Distinguish documentation review from a test you performed.
    validations:
      required: true
  - type: input
    id: relationship
    attributes:
      label: Relationship to the project, if any
